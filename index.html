<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สนามสอบ ป.3</title>
<meta name="description" content="เว็บจำลองข้อสอบ Final ป.3 — วิทยาศาสตร์ สังคม ประวัติศาสตร์ อังกฤษ ทบทวน ทำข้อสอบ ดูเฉลย และทำใหม่ได้ไม่จำกัด">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Thai+2:wght@500;600;700;800&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF1FB; --bg2:#FFFFFF; --card:#FFFFFF;
  --ink:#26314E; --muted:#6B7690; --line:#E3E9F5;
  --primary:#4C6EF5; --primary-ink:#FFFFFF;
  --sun:#FFC53D; --good:#2FBF71; --good-bg:#E7F8EF; --good-ink:#1B7A48;
  --soft:#FF8A5C; --soft-bg:#FFF0E9; --soft-ink:#C55A2E;
  --shadow:24px 24px 48px rgba(38,49,78,.08);
  --shadow-sm:0 6px 18px rgba(38,49,78,.10);
  --subject:#4C6EF5;
  --r:22px; --r-sm:16px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10152A; --bg2:#1A2138; --card:#1E2743;
    --ink:#EAEEF7; --muted:#9BA7C7; --line:#2E3A5D;
    --primary:#7A93FF; --primary-ink:#0E1428;
    --sun:#FFD666; --good:#45D390; --good-bg:rgba(69,211,144,.14); --good-ink:#7EE7B4;
    --soft:#FF9F73; --soft-bg:rgba(255,138,92,.15); --soft-ink:#FFB795;
    --shadow:24px 24px 48px rgba(0,0,0,.35);
    --shadow-sm:0 6px 18px rgba(0,0,0,.32);
  }
}
:root[data-theme="dark"]{
  --bg:#10152A; --bg2:#1A2138; --card:#1E2743;
  --ink:#EAEEF7; --muted:#9BA7C7; --line:#2E3A5D;
  --primary:#7A93FF; --primary-ink:#0E1428;
  --sun:#FFD666; --good:#45D390; --good-bg:rgba(69,211,144,.14); --good-ink:#7EE7B4;
  --soft:#FF9F73; --soft-bg:rgba(255,138,92,.15); --soft-ink:#FFB795;
  --shadow:24px 24px 48px rgba(0,0,0,.35);
  --shadow-sm:0 6px 18px rgba(0,0,0,.32);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Sarabun",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:17px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) 0 0;
}
h1,h2,h3,.display{font-family:"Baloo Thai 2","Sarabun",sans-serif;font-weight:800;line-height:1.2}
#app{max-width:660px;margin:0 auto;padding:18px 16px 64px}

/* ---------- buttons ---------- */
.btn{
  font-family:"Baloo Thai 2","Sarabun",sans-serif;font-weight:700;font-size:17px;
  border:none;border-radius:var(--r-sm);padding:14px 18px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .08s ease, box-shadow .15s ease, background .15s ease;
  color:var(--ink);background:var(--bg2);
}
.btn:active{transform:translateY(2px) scale(.99)}
.btn:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.btn-primary{background:var(--primary);color:var(--primary-ink);box-shadow:0 5px 0 rgba(0,0,0,.10)}
.btn-primary:active{box-shadow:0 1px 0 rgba(0,0,0,.10)}
.btn-soft{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:var(--shadow-sm)}
.btn.big{font-size:19px;padding:17px 22px}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;cursor:default;box-shadow:none}

/* ---------- home ---------- */
.home-hero{text-align:center;padding:14px 8px 6px}
.hero-badge{display:inline-block;background:var(--sun);color:#5b4300;font-family:"Baloo Thai 2";font-weight:700;
  font-size:14px;padding:5px 14px;border-radius:999px;letter-spacing:.3px}
.hero-title{font-size:clamp(34px,9vw,46px);margin:10px 0 6px;color:var(--ink);text-wrap:balance}
.hero-sub{color:var(--muted);margin:0 auto;max-width:34ch;font-weight:500}

.section-title{font-size:20px;margin:26px 4px 12px}

.panel{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px;margin:16px 0;box-shadow:var(--shadow-sm)}
.panel-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.ph-emoji{font-size:26px;flex:none}
.panel-title{font-family:"Baloo Thai 2";font-weight:700;font-size:18px}
.panel-desc{color:var(--muted);font-size:14px;font-weight:500}

.chip-row{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:"Baloo Thai 2";font-weight:600;font-size:15px;border:2px solid var(--line);background:var(--bg2);
  color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer;transition:transform .08s}
.chip:active{transform:scale(.96)}
.chip:hover{border-color:var(--subject)}
.chip:focus-visible{outline:3px solid var(--subject);outline-offset:2px}

/* subject cards */
.subject-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:520px){.subject-grid{grid-template-columns:1fr 1fr}}
.subject-card{
  text-align:left;border:2px solid var(--line);background:var(--card);border-radius:var(--r);
  padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;position:relative;overflow:hidden;
  box-shadow:var(--shadow-sm);transition:transform .1s ease, box-shadow .15s ease, border-color .15s;
  border-top:7px solid var(--subject);
}
.subject-card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(38,49,78,.14);border-color:var(--subject)}
.subject-card:active{transform:translateY(0)}
.subject-card:focus-visible{outline:3px solid var(--subject);outline-offset:2px}
.sc-emoji{font-size:38px;line-height:1}
.sc-name{font-family:"Baloo Thai 2";font-weight:800;font-size:22px}
.sc-meta{color:var(--muted);font-size:14px;font-weight:500}
.mini-last{font-size:13px;font-weight:600;color:var(--subject);background:color-mix(in srgb,var(--subject) 12%,transparent);
  display:inline-block;padding:3px 10px;border-radius:999px;margin-top:2px}
.mini-last.muted{color:var(--muted);background:var(--bg)}
.sc-go{margin-top:4px;font-family:"Baloo Thai 2";font-weight:700;color:var(--subject);font-size:15px}

/* recent */
.recent-row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line)}
.recent-row:first-of-type{border-top:none}
.rr-emoji{font-size:24px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--subject) 14%,transparent);border-radius:14px;flex:none}
.rr-main{flex:1;min-width:0}
.rr-name{font-family:"Baloo Thai 2";font-weight:700;font-size:16px}
.rr-date{color:var(--muted);font-size:12.5px}
.rr-score{text-align:right;font-family:"Baloo Thai 2"}
.rr-score b{font-size:18px}
.rr-score span{display:block;font-size:12.5px;color:var(--muted)}

.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:28px;font-weight:500}

/* ---------- topbar / subject page ---------- */
.topbar{margin:2px 0 10px}
.back-btn{font-family:"Baloo Thai 2";font-weight:700;font-size:15px;background:var(--card);border:2px solid var(--line);
  color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer;box-shadow:var(--shadow-sm)}
.back-btn:active{transform:scale(.97)}
.back-btn:focus-visible{outline:3px solid var(--primary);outline-offset:2px}

.subj-hero{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);
  border-left:9px solid var(--subject);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow-sm)}
.subj-hero.small{padding:14px 16px}
.subj-emoji{font-size:40px;flex:none}
.subj-title{font-size:26px;margin:0}
.subj-topics{color:var(--muted);font-size:13.5px;font-weight:500;margin-top:2px}

.last-pill{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:color-mix(in srgb,var(--subject) 10%,transparent);
  border-radius:14px;padding:10px 14px;margin:12px 0;font-size:14px}
.last-pill span{color:var(--muted);font-weight:600}
.last-pill b{font-family:"Baloo Thai 2";font-size:16px;color:var(--subject)}
.last-pill i{color:var(--muted);font-style:normal;margin-left:auto;font-size:12.5px}

.two-btn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
@media(max-width:420px){.two-btn{grid-template-columns:1fr}}

.set-list{display:flex;flex-direction:column;gap:10px}
.set-card{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);
  border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow-sm)}
.set-info{flex:1}
.set-label{font-family:"Baloo Thai 2";font-weight:800;font-size:19px}
.set-desc{color:var(--muted);font-size:14px;font-weight:500}

/* ---------- review cards ---------- */
.rev-list{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.rev-card{background:var(--card);border:2px solid var(--line);border-radius:var(--r-sm);padding:14px 16px;box-shadow:var(--shadow-sm)}
.rev-tag{display:inline-flex;align-items:center;gap:7px;font-family:"Baloo Thai 2";font-weight:700;font-size:15px;
  background:var(--bg);border-radius:999px;padding:4px 12px;margin-bottom:8px}
.rev-tag span{font-size:17px}
.rev-text{font-weight:500;line-height:1.55}
.sticky-cta{position:sticky;bottom:12px;margin-top:16px}
.sticky-cta .btn{width:100%;box-shadow:0 5px 0 rgba(0,0,0,.10),0 12px 24px rgba(38,49,78,.18)}

/* ---------- flash ---------- */
.flash-card{background:var(--card);border:2px solid var(--line);border-top:8px solid var(--subject);border-radius:var(--r);
  padding:28px 22px;text-align:center;box-shadow:var(--shadow);margin:16px 0;min-height:240px;
  display:flex;flex-direction:column;justify-content:center;gap:12px;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:scale(1);opacity:1}}
.flash-icon{font-size:52px}
.flash-label{font-family:"Baloo Thai 2";font-weight:800;font-size:22px;color:var(--subject)}
.flash-body{font-size:18px;font-weight:500;line-height:1.6;max-width:38ch;margin:0 auto}
.flash-dots{display:flex;gap:7px;justify-content:center;margin:6px 0 2px}
.flash-dots .dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.flash-dots .dot.on{background:var(--subject);transform:scale(1.25)}

/* ---------- exam ---------- */
.exam-top{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;
  box-shadow:var(--shadow-sm);position:relative}
.exam-quit{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);
  background:var(--bg);color:var(--muted);font-size:16px;cursor:pointer;line-height:1}
.exam-quit:active{transform:scale(.92)}
.exam-meta{display:flex;justify-content:space-between;align-items:center;padding-right:38px;margin-bottom:10px}
.exam-subj{font-family:"Baloo Thai 2";font-weight:700;font-size:16px}
.exam-count{font-family:"Baloo Thai 2";font-weight:700;font-size:15px;color:var(--subject);
  background:color-mix(in srgb,var(--subject) 13%,transparent);padding:3px 12px;border-radius:999px}
.progress{height:14px;background:var(--bg);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--subject),color-mix(in srgb,var(--subject) 60%,var(--sun)));
  border-radius:999px;transition:width .3s ease;min-width:2%}

.q-card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:18px 18px 20px;
  margin:14px 0;box-shadow:var(--shadow-sm)}
.q-tags{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.q-topic{font-family:"Baloo Thai 2";font-weight:600;font-size:13px;color:var(--subject);
  background:color-mix(in srgb,var(--subject) 12%,transparent);padding:3px 12px;border-radius:999px}
.q-diff{font-size:13px;letter-spacing:1px}
.q-text{font-family:"Baloo Thai 2";font-weight:700;font-size:21px;line-height:1.4;margin-bottom:16px;text-wrap:pretty}

.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;background:var(--bg2);border:2.5px solid var(--line);
  border-radius:var(--r-sm);padding:14px;cursor:pointer;font-size:17px;font-weight:500;color:var(--ink);
  transition:transform .07s, border-color .12s, background .12s;font-family:"Sarabun"}
.choice:hover{border-color:var(--subject)}
.choice:active{transform:scale(.99)}
.choice:focus-visible{outline:3px solid var(--subject);outline-offset:2px}
.ch-letter{flex:none;width:34px;height:34px;border-radius:50%;background:var(--bg);border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-family:"Baloo Thai 2";font-weight:800;font-size:16px;color:var(--muted)}
.choice.selected{border-color:var(--subject);background:color-mix(in srgb,var(--subject) 12%,transparent)}
.choice.selected .ch-letter{background:var(--subject);color:#fff;border-color:var(--subject)}
.choice.tf{font-family:"Baloo Thai 2";font-weight:700;font-size:19px}

.exam-nav{display:flex;justify-content:space-between;gap:10px;margin-top:4px}
.exam-nav .btn{flex:1;max-width:none}
.exam-nav>span{flex:1}
.exam-foot{text-align:center;color:var(--muted);font-size:13px;margin-top:12px;font-weight:500}

/* ---------- result ---------- */
.result-hero{border-radius:var(--r);padding:26px 20px;text-align:center;margin-bottom:8px;
  border:2px solid var(--line);box-shadow:var(--shadow);animation:pop .3s ease}
.lv-star{background:linear-gradient(160deg,#FFF6DC,#FFE9A8);color:#6b4e00;border-color:#FFDE86}
.lv-good{background:linear-gradient(160deg,#E5F8EE,#C9F0DA);color:#155e38;border-color:#B9EACD}
.lv-ok{background:linear-gradient(160deg,#EAF1FF,#D7E4FF);color:#2a3f75;border-color:#CBDBFF}
.lv-try{background:linear-gradient(160deg,#FFF0E9,#FFE0D2);color:#8a3f1c;border-color:#FFD2BE}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lv-star{background:linear-gradient(160deg,#3a3413,#2c2710);color:#FFE9A8;border-color:#5a4f1e}
:root:not([data-theme="light"]) .lv-good{background:linear-gradient(160deg,#14311f,#102a1a);color:#9ff0c1;border-color:#245a3a}
:root:not([data-theme="light"]) .lv-ok{background:linear-gradient(160deg,#1a2547,#151d38);color:#c3d4ff;border-color:#2f406e}
:root:not([data-theme="light"]) .lv-try{background:linear-gradient(160deg,#3a251b,#2c1c14);color:#ffc4a8;border-color:#5c3826}}
:root[data-theme="dark"] .lv-star{background:linear-gradient(160deg,#3a3413,#2c2710);color:#FFE9A8;border-color:#5a4f1e}
:root[data-theme="dark"] .lv-good{background:linear-gradient(160deg,#14311f,#102a1a);color:#9ff0c1;border-color:#245a3a}
:root[data-theme="dark"] .lv-ok{background:linear-gradient(160deg,#1a2547,#151d38);color:#c3d4ff;border-color:#2f406e}
:root[data-theme="dark"] .lv-try{background:linear-gradient(160deg,#3a251b,#2c1c14);color:#ffc4a8;border-color:#5c3826}
.rh-emoji{font-size:64px;line-height:1}
.rh-title{font-family:"Baloo Thai 2";font-weight:800;font-size:26px;margin-top:6px}
.rh-score{font-family:"Baloo Thai 2";margin-top:10px}
.rh-score b{font-size:56px;line-height:1}
.rh-score span{font-size:24px;opacity:.7;font-weight:700}
.rh-pct{font-family:"Baloo Thai 2";font-weight:800;font-size:22px;margin-top:2px}
.rh-msg{font-weight:600;margin-top:6px;opacity:.9}
.rh-stat{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.rh-stat .st{font-family:"Baloo Thai 2";font-weight:700;font-size:14px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.55)}
.rh-stat .st.no{background:rgba(255,255,255,.55)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rh-stat .st{background:rgba(0,0,0,.25)}}
:root[data-theme="dark"] .rh-stat .st{background:rgba(0,0,0,.25)}

.wt-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.wt-chip{font-family:"Baloo Thai 2";font-weight:700;font-size:15px;border:2px solid var(--soft);background:var(--soft-bg);
  color:var(--soft-ink);border-radius:999px;padding:8px 14px;cursor:pointer;transition:transform .08s}
.wt-chip i{font-style:normal;opacity:.75;font-weight:600;font-size:13px}
.wt-chip:active{transform:scale(.96)}

.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.action-grid .btn:first-child{grid-column:1/-1}
@media(max-width:420px){.action-grid{grid-template-columns:1fr}}

.ans-list{display:flex;flex-direction:column;gap:12px}
.ans-card{background:var(--card);border:2px solid var(--line);border-radius:var(--r-sm);padding:15px 16px;box-shadow:var(--shadow-sm);border-left:7px solid var(--good)}
.ans-card.no{border-left-color:var(--soft)}
.ans-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ans-no{font-family:"Baloo Thai 2";font-weight:800;font-size:15px;color:var(--muted)}
.ans-badge{font-family:"Baloo Thai 2";font-weight:700;font-size:13px;padding:3px 10px;border-radius:999px;background:var(--good-bg);color:var(--good-ink)}
.ans-card.no .ans-badge{background:var(--soft-bg);color:var(--soft-ink)}
.ans-q{font-family:"Baloo Thai 2";font-weight:700;font-size:17px;line-height:1.4;margin-bottom:8px}
.ans-line{font-size:15px;font-weight:500;margin:2px 0}
.ans-line.correct b{color:var(--good-ink)}
.ans-line.yours b{color:var(--soft-ink)}
.ans-explain{margin-top:8px;background:var(--bg);border-radius:12px;padding:9px 12px;font-size:14.5px;font-weight:500;line-height:1.5}

/* ---------- modal ---------- */
.modal-wrap{position:fixed;inset:0;background:rgba(20,26,45,.5);display:flex;align-items:flex-end;justify-content:center;
  z-index:50;padding:0;animation:fade .2s ease;backdrop-filter:blur(2px)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(min-width:560px){.modal-wrap{align-items:center;padding:20px}}
.modal{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;max-height:86vh;display:flex;flex-direction:column;
  box-shadow:0 -8px 40px rgba(0,0,0,.25);animation:slideup .25s ease}
@media(min-width:560px){.modal{border-radius:22px}}
@keyframes slideup{from{transform:translateY(30px)}to{transform:translateY(0)}}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);
  font-family:"Baloo Thai 2";font-weight:700}
.modal-x{width:32px;height:32px;border-radius:50%;border:none;background:var(--bg);color:var(--muted);font-size:15px;cursor:pointer}
.modal-body{padding:14px 18px;overflow:auto}
.m-item{margin-bottom:12px}
.m-item b{font-family:"Baloo Thai 2";font-size:15px}
.m-item p{margin:3px 0 0;font-weight:500;font-size:14.5px;color:var(--ink);line-height:1.5}
.modal-foot{padding:12px 18px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
.modal-foot .btn{flex:1}

@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
.modal.confirm{max-width:440px;align-self:center}
.confirm-body{font-family:"Baloo Thai 2","Sarabun",sans-serif;font-weight:700;font-size:18px;text-align:center;padding:26px 22px 6px;line-height:1.5}

/* CJK fallback so Chinese glyphs render (display faces lack them) */
.q-text,.ans-q{font-family:"Baloo Thai 2","Sarabun","PingFang SC","Hiragino Sans GB","Heiti SC","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC",sans-serif}
.ch-text,.choice,.ans-line,.ans-explain,.rev-text,.flash-body,.m-item p{font-family:"Sarabun","PingFang SC","Hiragino Sans GB","Heiti SC","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC",sans-serif}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   สนามสอบ ป.3  —  Mock Final Exam (P.3, Term 1/2569)
   Source of truth: answer-key PDFs provided by the user.
   Subjects: Science / Social / History / English
   Vanilla JS, no build step. Data + engine + UI in one file.
   ============================================================ */
(function () {
  "use strict";

  /* ---------- Subject metadata ---------- */

  /* ============================================================
     ENGINE:  randomization, blueprint sampling, scoring
     ============================================================ */
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // Build a mock exam that covers every topic, then fills to `count`.
  function buildExam(subject, count) {
    var pool = POOLS[subject];
    var total = count && count > 0 ? Math.min(count, pool.length) : pool.length;

    // group by topic
    var byTopic = {};
    pool.forEach(function (q) { (byTopic[q.topic] = byTopic[q.topic] || []).push(q); });
    var topics = Object.keys(byTopic);

    var picked = [];
    var usedIds = {};

    // 1) at least one from each topic (round-robin) so nothing disappears
    var shuffledByTopic = {};
    topics.forEach(function (t) { shuffledByTopic[t] = shuffle(byTopic[t]); });
    var round = 0, added = true;
    while (picked.length < total && added) {
      added = false;
      for (var i = 0; i < topics.length && picked.length < total; i++) {
        var list = shuffledByTopic[topics[i]];
        if (list[round]) {
          var q = list[round];
          if (!usedIds[q.id]) { usedIds[q.id] = 1; picked.push(q); added = true; }
        }
      }
      round++;
    }

    // 2) shuffle order, then prepare display (shuffle MC choices)
    var exam = shuffle(picked).slice(0, total).map(function (q) {
      var display;
      if (q.type === "tf") {
        display = { choices: q.choices.slice(), correct: q.answer };
      } else {
        var idx = q.choices.map(function (_, i) { return i; });
        var order = shuffle(idx);
        display = {
          choices: order.map(function (i) { return q.choices[i]; }),
          correct: order.indexOf(q.answer)
        };
      }
      return {
        ref: q, id: q.id, topic: q.topic, difficulty: q.difficulty, type: q.type,
        question: q.question, explanation: q.explanation,
        choices: display.choices, correct: display.correct
      };
    });
    return exam;
  }

  function grade(exam, answers) {
    var correct = 0, wrong = 0, wrongTopics = {};
    exam.forEach(function (item, i) {
      var a = answers[i];
      if (a === item.correct) correct++;
      else {
        wrong++;
        wrongTopics[item.topic] = (wrongTopics[item.topic] || 0) + 1;
      }
    });
    var total = exam.length;
    return {
      correct: correct, wrong: wrong, total: total,
      percentage: total ? Math.round((correct / total) * 100) : 0,
      wrongTopics: wrongTopics
    };
  }

    if (pct >= 90) return { emoji: "🌟", title: "ยอดเยี่ยม!", msg: "เก่งมากเลย เพอร์เฟกต์สุด ๆ", cls: "lv-star" };

  function saveResult(rec) {
    var h = loadHistory();
    h.unshift(rec);
    if (h.length > 60) h = h.slice(0, 60);
    try { localStorage.setItem(LS_KEY, JSON.stringify(h)); } catch (e) {}
  }
  function lastResultFor(subject) {
    var h = loadHistory();
    for (var i = 0; i < h.length; i++) if (h[i].subject === subject) return h[i];
    return null;
  }
  function fmtDate(iso) {
    try {
      var d = new Date(iso);
      var months = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
      return d.getDate() + " " + months[d.getMonth()] + " " + (d.getFullYear() + 543 - 2500 < 100 ? (d.getFullYear() + 543) : (d.getFullYear() + 543)) +
        " " + ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
    } catch (e) { return ""; }
  }

  /* ============================================================
     APP STATE + ROUTER
     ============================================================ */
  var state = {
    screen: "home",
    subject: null,
    setId: null,
    exam: [],
    answers: [],
    index: 0,
    retryWrongOnly: false
  };
  var root = document.getElementById("app");

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function setVar(subject) {
    document.documentElement.style.setProperty("--subject", SUBJECTS[subject] ? SUBJECTS[subject].color : "#4C6EF5");
  }
  function go(screen) { state.screen = screen; window.scrollTo(0, 0); render(); }

  /* ---------- HOME ---------- */
  function renderHome() {
    setVar(null);
    var cards = SUBJECT_ORDER.map(function (key) {
      var s = SUBJECTS[key];
      var pool = POOLS[key];
      var topicCount = Object.keys(s.topics).length;
      var last = lastResultFor(key);
      var lastHtml = last
        ? '<div class="mini-last">ล่าสุด <b>' + last.correct + "/" + last.total + "</b> · " + last.percentage + "%</div>"
        : '<div class="mini-last muted">ยังไม่เคยทำ</div>';
      return (
        '<button class="subject-card" style="--subject:' + s.color + '" data-nav="subject" data-subject="' + key + '">' +
          '<div class="sc-emoji">' + s.emoji + "</div>" +
          '<div class="sc-body">' +
            '<div class="sc-name">' + s.name + "</div>" +
            '<div class="sc-meta">' + pool.length + " ข้อในคลัง · " + topicCount + " เรื่อง</div>" +
            lastHtml +
          "</div>" +
          '<div class="sc-go">เริ่มทำข้อสอบ ▸</div>' +
        "</button>"
      );
    }).join("");

    var flashChips = SUBJECT_ORDER.map(function (key) {
      var s = SUBJECTS[key];
      return '<button class="chip" style="--subject:' + s.color + '" data-nav="flash" data-subject="' + key + '">' + s.emoji + " " + s.short + "</button>";
    }).join("");

    root.innerHTML =
      '<header class="home-hero">' +
        '<div class="hero-badge">ป.3 · เทอม 1</div>' +
        '<h1 class="hero-title">สนามสอบ ป.3</h1>' +
        '<p class="hero-sub">ทบทวนเร็ว ✏️ ทำข้อสอบ 🎯 ดูคะแนน 💡 แล้วลองใหม่ให้เก่งขึ้น!</p>' +
      "</header>" +
      '<section class="panel flash-panel">' +
        '<div class="panel-head"><span class="ph-emoji">⏱️</span><div><div class="panel-title">ทบทวนเร็ว 5 นาที</div><div class="panel-desc">อ่านสรุปสั้น ๆ ก่อนลุยข้อสอบ</div></div></div>' +
        '<div class="chip-row">' + flashChips + "</div>" +
      "</section>" +
      '<section><h2 class="section-title">เลือกวิชา</h2><div class="subject-grid">' + cards + "</div></section>" +
      renderRecentPanel() +
      '<div style="text-align:center;margin-top:24px">' +
        '<a class="btn btn-soft" style="text-decoration:none" href="https://napasorn-kl.github.io/p3-final-exam/source.html" target="_blank" rel="noopener">🔎 ดูที่มาข้อสอบ</a>' +
      '</div>' +
      '<footer class="foot">ทำแล้วทำอีกได้ไม่จำกัด · คะแนนเก็บไว้ในเครื่องนี้เท่านั้น 💾</footer>';
  }

  function renderRecentPanel() {
    var h = loadHistory().slice(0, 4);
    if (!h.length) return "";
    var rows = h.map(function (r) {
      var s = SUBJECTS[r.subject];
      var lv = levelFor(r.percentage);
      return (
        '<div class="recent-row">' +
          '<span class="rr-emoji" style="--subject:' + s.color + '">' + s.emoji + "</span>" +
          '<div class="rr-main"><div class="rr-name">' + s.name + "</div><div class=\"rr-date\">" + fmtDate(r.date) + "</div></div>" +
          '<div class="rr-score"><b>' + r.correct + "/" + r.total + "</b><span>" + lv.emoji + " " + r.percentage + "%</span></div>" +
        "</div>"
      );
    }).join("");
    return '<section class="panel"><div class="panel-head"><span class="ph-emoji">📈</span><div><div class="panel-title">ทำข้อสอบล่าสุด</div><div class="panel-desc">ผลการทำที่ผ่านมา</div></div></div>' + rows + "</section>";
  }

  /* ---------- SUBJECT (choose set) ---------- */
  function renderSubject() {
    var key = state.subject, s = SUBJECTS[key];
    setVar(key);
    var last = lastResultFor(key);
    var lastPanel = last
      ? '<div class="last-pill"><span>คะแนนล่าสุด</span><b>' + last.correct + "/" + last.total + " · " + last.percentage + "%</b><i>" + fmtDate(last.date) + "</i></div>"
      : "";
    var sets = EXAM_SETS.map(function (set) {
      var n = set.count === 0 ? POOLS[key].length : Math.min(set.count, POOLS[key].length);
      return (
        '<div class="set-card">' +
          '<div class="set-info"><div class="set-label">' + set.label + "</div><div class=\"set-desc\">" + n + " ข้อ · ~" + set.mins + " นาที</div></div>" +
          '<button class="btn btn-primary" data-nav="start" data-subject="' + key + '" data-set="' + set.id + '">เริ่มทำ ▸</button>' +
        "</div>"
      );
    }).join("");

    root.innerHTML =
      topBar("🏠 หน้าแรก", "home") +
      '<header class="subj-hero" style="--subject:' + s.color + '">' +
        '<div class="subj-emoji">' + s.emoji + "</div>" +
        '<div><h1 class="subj-title">' + s.name + "</h1><div class=\"subj-topics\">" + Object.keys(s.topics).map(function (t) { return s.topics[t]; }).join(" · ") + "</div></div>" +
      "</header>" +
      lastPanel +
      '<div class="two-btn">' +
        '<button class="btn btn-soft" data-nav="review" data-subject="' + key + '">📖 ทบทวนก่อนสอบ</button>' +
        '<button class="btn btn-soft" data-nav="flash" data-subject="' + key + '">⏱️ ทบทวนเร็ว 5 นาที</button>' +
      "</div>" +
      '<h2 class="section-title">เลือกชุดข้อสอบ</h2>' +
      '<div class="set-list">' + sets + "</div>";
  }

  /* ---------- REVIEW (pre-exam summary) ---------- */
  function renderReview() {
    var key = state.subject, s = SUBJECTS[key];
    setVar(key);
    var items = REVIEW[key].map(function (r) {
      return (
        '<div class="rev-card">' +
          '<div class="rev-tag"><span>' + r.icon + "</span>" + esc(r.label) + "</div>" +
          '<div class="rev-text">' + esc(r.text) + "</div>" +
        "</div>"
      );
    }).join("");
    root.innerHTML =
      topBar("◂ กลับ", "subject") +
      '<header class="subj-hero small" style="--subject:' + s.color + '"><div class="subj-emoji">📖</div><div><h1 class="subj-title">ทบทวนก่อนสอบ</h1><div class="subj-topics">' + s.name + "</div></div></header>" +
      '<div class="rev-list">' + items + "</div>" +
      '<div class="sticky-cta"><button class="btn btn-primary big" data-nav="start" data-subject="' + key + '" data-set="1">พร้อมแล้ว! เริ่มทำข้อสอบ ▸</button></div>';
  }

  /* ---------- FLASH (5-min quick review, one card at a time) ---------- */
  function renderFlash() {
    var key = state.subject, s = SUBJECTS[key];
    setVar(key);
    var cards = REVIEW[key];
    var i = Math.min(state.flashIndex || 0, cards.length - 1);
    state.flashIndex = i;
    var r = cards[i];
    var isLast = i === cards.length - 1;
    root.innerHTML =
      topBar("◂ กลับ", "subject") +
      '<header class="subj-hero small" style="--subject:' + s.color + '"><div class="subj-emoji">⏱️</div><div><h1 class="subj-title">ทบทวนเร็ว 5 นาที</h1><div class="subj-topics">' + s.name + " · การ์ด " + (i + 1) + "/" + cards.length + "</div></div></header>" +
      '<div class="flash-card" style="--subject:' + s.color + '">' +
        '<div class="flash-icon">' + r.icon + "</div>" +
        '<div class="flash-label">' + esc(r.label) + "</div>" +
        '<div class="flash-body">' + esc(r.text) + "</div>" +
      "</div>" +
      '<div class="flash-dots">' + cards.map(function (_, k) { return '<span class="dot' + (k === i ? " on" : "") + '"></span>'; }).join("") + "</div>" +
      '<div class="two-btn">' +
        (i > 0 ? '<button class="btn btn-soft" data-flash="prev">◂ ก่อนหน้า</button>' : '<button class="btn btn-soft" disabled>◂ ก่อนหน้า</button>') +
        (isLast
          ? '<button class="btn btn-primary" data-nav="start" data-subject="' + key + '" data-set="1">✏️ ลองทำข้อสอบ</button>'
          : '<button class="btn btn-primary" data-flash="next">ถัดไป ▸</button>') +
      "</div>";
  }

  /* ---------- EXAM ---------- */
  function startExam(subject, setId, wrongOnly) {
    state.subject = subject;
    state.setId = setId;
    state.retryWrongOnly = !!wrongOnly;
    if (!wrongOnly) {
      var set = EXAM_SETS.filter(function (x) { return x.id === setId; })[0] || EXAM_SETS[0];
      state.exam = buildExam(subject, set.count);
    }
    state.answers = state.exam.map(function () { return null; });
    state.index = 0;
    go("exam");
  }

  function renderExam() {
    var key = state.subject, s = SUBJECTS[key];
    setVar(key);
    var i = state.index, item = state.exam[i], total = state.exam.length;
    var pct = Math.round(((i) / total) * 100);
    var answered = state.answers[i];
    var dm = DIFF_META[item.difficulty];

    var choices = item.choices.map(function (c, ci) {
      var sel = answered === ci ? " selected" : "";
      var letter = item.type === "tf" ? (ci === 0 ? "✓" : "✕") : String.fromCharCode(65 + ci);
      return (
        '<button class="choice' + sel + (item.type === "tf" ? " tf" : "") + '" data-choose="' + ci + '">' +
          '<span class="ch-letter">' + letter + "</span>" +
          '<span class="ch-text">' + esc(c) + "</span>" +
        "</button>"
      );
    }).join("");

    var isLast = i === total - 1;
    var answeredCount = state.answers.filter(function (a) { return a !== null; }).length;

    root.innerHTML =
      '<div class="exam-top" style="--subject:' + s.color + '">' +
        '<button class="exam-quit" data-exam="quit">✕</button>' +
        '<div class="exam-meta"><span class="exam-subj">' + s.emoji + " " + s.short + "</span>" +
          '<span class="exam-count">ข้อ ' + (i + 1) + " / " + total + "</span></div>" +
        '<div class="progress"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
      "</div>" +
      '<div class="q-card">' +
        '<div class="q-tags"><span class="q-topic">' + esc(SUBJECTS[key].topics[item.topic] || item.topic) + '</span><span class="q-diff" title="' + dm.label + '">' + dm.stars + "</span></div>" +
        '<div class="q-text">' + esc(item.question) + "</div>" +
        '<div class="choices">' + choices + "</div>" +
      "</div>" +
      '<div class="exam-nav">' +
        (i > 0 ? '<button class="btn btn-soft" data-exam="prev">◂ ย้อนกลับ</button>' : '<span></span>') +
        (isLast
          ? '<button class="btn btn-primary" data-exam="submit">ส่งคำตอบ ✅</button>'
          : '<button class="btn btn-primary" data-exam="next">ข้อถัดไป ▸</button>') +
      "</div>" +
      '<div class="exam-foot">ตอบแล้ว ' + answeredCount + " / " + total + " ข้อ · เปลี่ยนคำตอบได้ก่อนส่ง</div>";
  }

  function submitExam() {
    var unanswered = state.answers.filter(function (a) { return a === null; }).length;
    if (unanswered > 0) {
      confirmModal(
        "ยังเหลืออีก " + unanswered + " ข้อที่ยังไม่ได้ตอบ ต้องการส่งคำตอบเลยไหม? (ข้อที่ไม่ตอบจะถือว่ายังไม่ถูก)",
        "ส่งเลย", doSubmit);
      return;
    }
    doSubmit();
  }

  function doSubmit() {
    var res = grade(state.exam, state.answers);
    saveResult({
      subject: state.subject, setId: state.setId,
      correct: res.correct, total: res.total, percentage: res.percentage,
      wrongTopics: Object.keys(res.wrongTopics), date: new Date().toISOString()
    });
    state.lastResult = res;
    go("result");
  }

  /* ---------- RESULT ---------- */
  function renderResult() {
    var key = state.subject, s = SUBJECTS[key];
    setVar(key);
    var res = state.lastResult || grade(state.exam, state.answers);
    var lv = levelFor(res.percentage);

    // wrong topics analysis
    var wt = res.wrongTopics;
    var wtKeys = Object.keys(wt).sort(function (a, b) { return wt[b] - wt[a]; });
    var wrongPanel = "";
    if (wtKeys.length) {
      var chips = wtKeys.map(function (t) {
        return '<button class="wt-chip" data-review-topic="' + t + '">🧠 ' + esc(SUBJECTS[key].topics[t] || t) + " <i>" + wt[t] + " ข้อ</i></button>";
      }).join("");
      wrongPanel =
        '<section class="panel"><div class="panel-head"><span class="ph-emoji">🧠</span><div><div class="panel-title">เรื่องที่ควรทบทวน</div><div class="panel-desc">แตะเพื่อดูสรุปสั้น ๆ แล้วลองทำข้อที่ผิดอีกครั้ง</div></div></div>' +
        '<div class="wt-row">' + chips + "</div>" +
        '<button class="btn btn-soft full" data-review-topic="__all">📖 ดูสรุปทบทวนทั้งหมด</button>' +
        "</section>";
    }

    // per-question review
    var reviewItems = state.exam.map(function (item, i) {
      var a = state.answers[i];
      var correct = a === item.correct;
      var yourAns = a === null ? "— (ไม่ได้ตอบ)" : esc(item.choices[a]);
      return (
        '<div class="ans-card ' + (correct ? "ok" : "no") + '">' +
          '<div class="ans-head"><span class="ans-no">ข้อ ' + (i + 1) + "</span>" +
            '<span class="ans-badge">' + (correct ? "✅ ถูกต้อง" : "🔎 ลองทบทวน") + "</span></div>" +
          '<div class="ans-q">' + esc(item.question) + "</div>" +
          '<div class="ans-line correct"><b>✅ คำตอบที่ถูก:</b> ' + esc(item.choices[item.correct]) + "</div>" +
          (correct ? "" : '<div class="ans-line yours"><b>📝 หนูตอบ:</b> ' + yourAns + "</div>") +
          '<div class="ans-explain">💡 ' + esc(item.explanation) + "</div>" +
        "</div>"
      );
    }).join("");

    root.innerHTML =
      '<div class="result-hero ' + lv.cls + '">' +
        '<div class="rh-emoji">' + lv.emoji + "</div>" +
        '<div class="rh-title">' + lv.title + "</div>" +
        '<div class="rh-score"><b>' + res.correct + "</b><span>/ " + res.total + "</span></div>" +
        '<div class="rh-pct">' + res.percentage + "%</div>" +
        '<div class="rh-msg">' + lv.msg + "</div>" +
        '<div class="rh-stat"><span class="st ok">ถูก ' + res.correct + " ข้อ</span><span class=\"st no\">ต้องทบทวน " + res.wrong + " ข้อ</span></div>" +
      "</div>" +
      wrongPanel +
      '<div class="action-grid">' +
        '<button class="btn btn-primary big" data-nav="retry">🔄 ทำใหม่อีกครั้ง</button>' +
        (res.wrong > 0 ? '<button class="btn btn-soft" data-nav="retry-wrong">🎯 ทำเฉพาะข้อที่ผิด</button>' : "") +
        '<button class="btn btn-soft" data-nav="review" data-subject="' + key + '">📚 ทบทวนก่อนทำใหม่</button>' +
        '<button class="btn btn-soft" data-nav="home">🏠 กลับหน้าแรก</button>' +
      "</div>" +
      '<h2 class="section-title">เฉลยทุกข้อ</h2>' +
      '<div class="ans-list">' + reviewItems + "</div>";
  }

  // Small modal to show a topic summary from the result screen
  function showTopicReview(topicKey) {
    var key = state.subject;
    var cards = REVIEW[key];
    var content;
    if (topicKey === "__all") {
      content = cards.map(function (r) { return '<div class="m-item"><b>' + r.icon + " " + esc(r.label) + "</b><p>" + esc(r.text) + "</p></div>"; }).join("");
    } else {
      // match review cards loosely to the topic by label/keyword; else show all
      content = cards.map(function (r) { return '<div class="m-item"><b>' + r.icon + " " + esc(r.label) + "</b><p>" + esc(r.text) + "</p></div>"; }).join("");
    }
    var wrap = document.createElement("div");
    wrap.className = "modal-wrap";
    wrap.innerHTML =
      '<div class="modal">' +
        '<div class="modal-head"><span>📖 สรุปทบทวน · ' + esc(SUBJECTS[key].name) + '</span><button class="modal-x" data-modal="close">✕</button></div>' +
        '<div class="modal-body">' + content + "</div>" +
        '<div class="modal-foot">' +
          '<button class="btn btn-primary" data-modal="retry-wrong">🎯 ลองทำข้อที่ผิดอีกครั้ง</button>' +
          '<button class="btn btn-soft" data-modal="close">ปิด</button>' +
        "</div>" +
      "</div>";
    document.body.appendChild(wrap);
  }

  function retryWrongOnly() {
    var wrong = [];
    state.exam.forEach(function (item, i) { if (state.answers[i] !== item.correct) wrong.push(item); });
    if (!wrong.length) { go("home"); return; }
    // rebuild fresh display (re-shuffle choices) from the original refs
    state.exam = shuffle(wrong).map(function (item) {
      var q = item.ref;
      if (q.type === "tf") return { ref: q, id: q.id, topic: q.topic, difficulty: q.difficulty, type: q.type, question: q.question, explanation: q.explanation, choices: q.choices.slice(), correct: q.answer };
      var order = shuffle(q.choices.map(function (_, i) { return i; }));
      return { ref: q, id: q.id, topic: q.topic, difficulty: q.difficulty, type: q.type, question: q.question, explanation: q.explanation, choices: order.map(function (i) { return q.choices[i]; }), correct: order.indexOf(q.answer) };
    });
    state.answers = state.exam.map(function () { return null; });
    state.index = 0;
    state.retryWrongOnly = true;
    go("exam");
  }

  /* ---------- custom confirm (window.confirm is blocked in sandboxed artifacts) ---------- */
  function confirmModal(message, yesLabel, onYes) {
    var wrap = document.createElement("div");
    wrap.className = "modal-wrap";
    wrap.innerHTML =
      '<div class="modal confirm">' +
        '<div class="confirm-body">' + esc(message) + "</div>" +
        '<div class="modal-foot">' +
          '<button class="btn btn-primary" data-confirm="yes">' + esc(yesLabel) + "</button>" +
          '<button class="btn btn-soft" data-confirm="no">ยกเลิก</button>' +
        "</div>" +
      "</div>";
    document.body.appendChild(wrap);
    wrap.addEventListener("click", function (ev) {
      var b = ev.target.closest("[data-confirm]");
      if (!b) return;               // let backdrop clicks fall through to the global closer
      var yes = b.getAttribute("data-confirm") === "yes";
      if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
      if (yes && onYes) onYes();
    });
  }

  /* ---------- top bar helper ---------- */
  function topBar(label, target) {
    return '<div class="topbar"><button class="back-btn" data-nav="' + target + '">' + esc(label) + "</button></div>";
  }

  /* ============================================================
     RENDER SWITCH
     ============================================================ */
  function render() {
    switch (state.screen) {
      case "home": renderHome(); break;
      case "subject": renderSubject(); break;
      case "review": renderReview(); break;
      case "flash": renderFlash(); break;
      case "exam": renderExam(); break;
      case "result": renderResult(); break;
      default: renderHome();
    }
  }

  /* ============================================================
     EVENT DELEGATION
     ============================================================ */
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-nav],[data-choose],[data-exam],[data-flash],[data-review-topic],[data-modal]");
    if (!t) return;

    // navigation
    if (t.hasAttribute("data-nav")) {
      var nav = t.getAttribute("data-nav");
      var subj = t.getAttribute("data-subject");
      if (nav === "home") return go("home");
      if (nav === "subject") { state.subject = subj; return go("subject"); }
      if (nav === "review") { state.subject = subj; return go("review"); }
      if (nav === "flash") { state.subject = subj; state.flashIndex = 0; return go("flash"); }
      if (nav === "start") { return startExam(subj, parseInt(t.getAttribute("data-set"), 10) || 1, false); }
      if (nav === "retry") { return startExam(state.subject, state.setId || 1, false); }
      if (nav === "retry-wrong") { return retryWrongOnly(); }
      return;
    }

    // choose an answer
    if (t.hasAttribute("data-choose")) {
      var ci = parseInt(t.getAttribute("data-choose"), 10);
      state.answers[state.index] = ci;
      // update selection without full re-render for snappiness
      var box = t.parentNode;
      Array.prototype.forEach.call(box.querySelectorAll(".choice"), function (c) { c.classList.remove("selected"); });
      t.classList.add("selected");
      // reflect answered-count line
      var foot = document.querySelector(".exam-foot");
      if (foot) {
        var answeredCount = state.answers.filter(function (a) { return a !== null; }).length;
        foot.textContent = "ตอบแล้ว " + answeredCount + " / " + state.exam.length + " ข้อ · เปลี่ยนคำตอบได้ก่อนส่ง";
      }
      return;
    }

    // exam nav
    if (t.hasAttribute("data-exam")) {
      var act = t.getAttribute("data-exam");
      if (act === "next") { if (state.index < state.exam.length - 1) { state.index++; render(); } return; }
      if (act === "prev") { if (state.index > 0) { state.index--; render(); } return; }
      if (act === "submit") { return submitExam(); }
      if (act === "quit") {
        confirmModal("ออกจากข้อสอบ? คำตอบที่ทำอยู่จะหายไปนะ", "ออก", function () { go("home"); });
        return;
      }
      return;
    }

    // flash nav
    if (t.hasAttribute("data-flash")) {
      var f = t.getAttribute("data-flash");
      if (f === "next") { state.flashIndex = (state.flashIndex || 0) + 1; render(); }
      if (f === "prev") { state.flashIndex = Math.max(0, (state.flashIndex || 0) - 1); render(); }
      return;
    }

    // result -> topic review modal
    if (t.hasAttribute("data-review-topic")) {
      return showTopicReview(t.getAttribute("data-review-topic"));
    }

    // modal actions
    if (t.hasAttribute("data-modal")) {
      var m = t.getAttribute("data-modal");
      var wrap = t.closest(".modal-wrap");
      if (wrap) wrap.parentNode.removeChild(wrap);
      if (m === "retry-wrong") retryWrongOnly();
      return;
    }
  });

  // close modal on backdrop click
  document.addEventListener("click", function (ev) {
    if (ev.target.classList && ev.target.classList.contains("modal-wrap")) {
      ev.target.parentNode.removeChild(ev.target);
    }
  });

  /* ---------- boot ---------- */
  render();
})();
</script>
</body>
</html>
